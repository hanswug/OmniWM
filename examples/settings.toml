# OmniWM (hanswug fork): Hans's full working settings.toml, exactly as he runs it.
# Niri layout with shrink-to-fit, Reset Layout on Visible Containers changes, the fork's
# new-window placement, padding presets cycled with Control+Option+0, Visible Containers on
# Control+Option+1–4, borders on Control+Option+B, and command feedback on. Copy it to
# ~/.config/omniwm/settings.toml (back up yours first) and adjust; the app rules name the
# apps Hans uses, so drop the ones you don't have.

schemaVersion = 5

[appearance]
mode = "dark"
tabRailAppIcons = true

[borders]
enabled = false
width = 3.0

[borders.color]
alpha = 1.0
blue = 1.0
green = 0.1983509958
red = 0.01680417731

[borders.glow]
enabled = true
opacity = 0.6
radius = 8.0

[clipboard]
historyEnabled = false
ignoredTypes = []
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[commandPalette]
searchedModes = ["commands"]
unifiedSearch = false

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

[focus]
clickFocusWithoutScrolling = true
crossesMonitorAtEdge = false
edgeNavigationInterval = 1.5
followsMouse = false
followsMouseOnlyFullyVisible = false
followsWindowToMonitor = true
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = true
raiseOnMouseFocus = false

[gaps]
fullscreenUsesOuterGaps = true
size = 9.0

[gaps.outer]
bottom = 8.0
left = 640.0
right = 640.0
top = 720.0

[[gaps.presets]]
bottom = 8.0
left = 8.0
name = "Fullscreen"
right = 8.0
top = 8.0

[[gaps.presets]]
bottom = 8.0
left = 8.0
name = "Wide Tall"
right = 8.0
top = 540.0

[[gaps.presets]]
bottom = 8.0
left = 8.0
name = "Wide"
right = 8.0
top = 720.0

[[gaps.presets]]
bottom = 8.0
left = 640.0
name = "Single"
right = 640.0
top = 720.0

[general]
animationSpeed = 1.0
animationsEnabled = true
commandFeedback = true
defaultLayoutType = "niri"
hotkeysEnabled = true
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = true
preventSleepEnabled = false
slideWorkspaceSwitches = false
systemHyperTrigger = "None"
updateChecksEnabled = false
workspaceAutoBackAndForth = false

[gestures]
adoptNativeMoveAcrossDisplays = false
adoptNativeResize = false
dwindleGroupDragAcrossDisplays = "group"
fingerCount = 3
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
mouseWheelSensitivity = 1.0
overviewGestureEnabled = false
overviewGestureFingerCount = 4
resizePreviewStyle = "live"
scrollEnabled = false
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "snap"
windowGestureSensitivity = 1.0
windowMoveEnabled = false
windowMoveFingerCount = 4
windowResizeEnabled = false
windowResizeFingerCount = 3
workspaceSwipeAxis = "vertical"
workspaceSwipeEdgeBehavior = "cycle"
workspaceSwipeEnabled = false
workspaceSwipeFingerCount = 3

[hiddenBar]
enabled = false
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[island]
enabled = false

[keyboardModes]

[launcher]
appFolders = []
cliFolders = []
entries = []
shell = "system"
shellExecutable = ""
terminal = "terminal"

[mouseWarp]
constrainToArrangement = false
enabled = true
margin = 1

[niri]
allowOverscroll = false
alwaysCenterSingleColumn = false
centerFocusedColumn = "never"
containerPrimarySpanPresets = [0.3333333333333333, 0.5, 0.6666666666666666]
edgeGaps = false
infiniteLoop = false
moveWindowStacksIntoColumn = true
newWindowPlacement = "last"
overscrollVisibleStripPercent = 5
resizeStepPercent = 5
shrinkToFit = true
singleWindowFit = "fill"
visibleContainerChangeAction = "reset"
visibleContainerCount = 1

[overview]
enabled = true
invertScrollDirection = false
matchFocusBorder = true
mouseScrollSpeed = 1.0
zoom = 1.0

[overview.backdrop]
alpha = 0.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders]

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[quakeTerminal]
animationDuration = 0.2
autoHide = false
backgroundBlurRadius = 20
backgroundEffect = "standardBlur"
enabled = true
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 0.9500000000000001
position = "bottom"
provider = "ghostty"
widthPercent = 50.0

[routing]
arrangements = []
mode = "macOS"

[scratchpads]

[scratchpads.labels]

[shellPermissions]
programs = []
widgets = []

[shellPermissions.services]
lyrics = false
weather = false

[statusBar]
showAppNames = false
showIcon = false
showLayout = false
showWorkspaceName = false
useWorkspaceId = false

[statusMenu]
hiddenControls = []
hiddenMenuItems = []
showControlHelp = true
showControls = true
showMenuItems = true

[windowSwitcher]
commandTab = "activeWorkspace"
enabled = false
optionTab = "disabled"
order = "omniLayout"
scope = "allWorkspaces"
showFooter = false

[workspaceBar]
autoHide = false
autoHideHideDelayMilliseconds = 0.0
autoHideRevealDelayMilliseconds = 0.0
backgroundOpacity = 0.0
deduplicateAppIcons = false
enabled = true
excludedBundleIDs = []
fullWidth = false
fullWidthNotchMode = "rightOfNotch"
height = 28.0
hideEmptyWorkspaces = false
hideInNativeFullscreen = false
hoverPreviewsEnabled = true
notchActiveZoneWidth = 100.0
notchMode = "moveBelowMenuBar"
notificationBadgeRefreshIntervalSeconds = 5.0
notificationBadges = "off"
position = "overlappingMenuBar"
reserveLayoutSpace = false
revealHoldMilliseconds = 200.0
revealModifier = "off"
showAccentHighlights = true
showFloatingWindows = true
showItemBackgrounds = true
showLabels = true
solidBlackBackground = false
systemStatsButton = true
transparentBackground = false
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.iconOverrides]

